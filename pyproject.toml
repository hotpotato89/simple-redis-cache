[project]
name = "simple-redis-cache"
version = "1.1.0"
description = "A library that simplifies working with Redis in Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "redis>=8.0.1",
]
license = { file = "LICENSE" }
authors = [
    { name = "hotpotato89", email = "ramilreading@gmail.com" }
]

[dependency-groups]
dev = [
    "bump-my-version>=1.5.1",
    "fakeredis>=2.36.2",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "pydantic>=2.13.4",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_redis_cache"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.bumpversion]
current_version = "1.1.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = true
push_tag = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []
allow_shell_hooks = false
